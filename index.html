<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【愛知県】大村知事悪政周知チラシ　配布エリア共有マップ</title>

<!-- 外部データの接続準備を先に始める -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<style>
/* =========================
   基本
========================= */
html,
body{
  height:100%;
  margin:0;
}

#map{
  height:100%;
}

.confirm-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
}

.confirm-box{
  width:min(320px, 85vw);
  background:white;
  border-radius:14px;
  padding:18px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
  text-align:center;
}

.confirm-message{
  font-size:16px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:18px;
  color:#333;
}

.confirm-buttons{
  display:flex;
  gap:10px;
}

.confirm-buttons button{
  flex:1;
  padding:10px 0;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
}

#confirmOkButton{
  background:#ff9800;
  color:white;
}

#confirmCancelButton{
  background:#e0e0e0;
  color:#333;
}
.area-choice-box{
  width:min(400px, calc(100vw - 32px));
  max-height:80vh;
  overflow:hidden;
  background:white;
  border-radius:14px;
  padding:16px;
  box-sizing:border-box;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.area-choice-title{
  margin-bottom:10px;
  color:#333;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}

.area-choice-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:55vh;
  overflow-y:auto;
  padding:2px;
}

.area-choice-button{
  width:100%;
  padding:9px 10px;
  background:#fff;
  color:#333;
  border:1px solid #ccc;
  border-left:6px solid #999;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
}

.area-choice-button.planned{
  border-left-color:#0066ff;
  background:#f4f8ff;
}

.area-choice-button.done{
  border-left-color:#ff3333;
  background:#fff5f5;
}

.area-choice-type{
  display:block;
  margin-bottom:3px;
  font-size:14px;
  font-weight:bold;
}

.area-choice-meta{
  display:block;
  color:#555;
  font-size:12px;
  line-height:1.45;
}

.area-choice-cancel{
  width:100%;
  margin-top:12px;
  padding:9px;
  background:#e0e0e0;
  color:#333;
  border:none;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}


.city-candidate-box{
  width:min(420px, calc(100vw - 32px));
  max-height:80vh;
  overflow:hidden;
  background:white;
  border-radius:14px;
  padding:16px;
  box-sizing:border-box;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.city-candidate-title{
  margin-bottom:12px;
  color:#333;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}

.city-candidate-list{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:8px;
  max-height:55vh;
  overflow-y:auto;
  padding:2px;
}

.city-candidate-button{
  min-height:40px;
  padding:8px 6px;
  background:#fff8ec;
  color:#333;
  border:1px solid #ff9800;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.city-candidate-button:hover{
  background:#ff9800;
  color:white;
}

.city-candidate-cancel{
  width:100%;
  margin-top:12px;
  padding:9px;
  background:#e0e0e0;
  color:#333;
  border:none;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.panel{
  position:absolute;
  background:white;
  padding:10px;
  z-index:1000;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.3);
}

.city-move-panel{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%, -50%);
  z-index:2500;

  background:white;
  border-left:5px solid #ff9800;
  border-radius:10px;
  padding:10px 12px;

  box-shadow:0 2px 8px rgba(0,0,0,0.3);

  font-size:14px;
  font-weight:bold;
  line-height:1.5;
}

.city-move-text{
  margin-bottom:8px;
  color:#333;
}

.city-move-panel button{
  display:block;
  width:100%;
  margin-top:6px;
  padding:7px 8px;
  font-size:13px;
  font-weight:bold;
}

#cityMoveButton{
  background:#ff9800;
  color:white;
  border:1px solid #e08000;
  border-radius:6px;
}

#cityMoveCancel{
  background:#eeeeee;
  color:#333;
  border:1px solid #cccccc;
  border-radius:6px;
}

.title{
  top:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:bold;
}

.error-text{
  color:red;
  font-size:13px;
  margin-top:4px;
  margin-bottom:8px;
  font-weight:bold;
}

/* =========================
   モーダル
========================= */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:420px;
  padding:18px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.35);
  font-size:15px;
}

.modal-box h3{
  margin-top:0;
}

.modal-box label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

.modal-box label span{
  color:#888;
  font-weight:normal;
  font-size:12px;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  box-sizing:border-box;
  padding:8px;
  margin-top:4px;
}

.date-row{
  display:flex;
  gap:6px;
}

.date-row select{
  width:33.3%;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-buttons button{
  flex:1;
  padding:10px;
}

/* 修正依頼フォームの日付欄だけ縦並び */
#requestFormModal .date-row{
  display:block;
}

#requestFormModal .date-row select{
  width:100%;
  margin-bottom:6px;
}

/* =========================
   各パネル
========================= */

/* 「エリア作図は各市町村ページにて」 */
#parentNotice{
  position:absolute;
  top:100px;
  left:18px;

  z-index:1000;

  background:#fff9e8;

  border-left:5px solid #ff9800;
  border-radius:10px;

  padding:10px 12px;

  font-size:16px;
  font-weight:bold;

  color:#444;

  line-height:1.5;

  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}


/* 市町村名を検索 */
.city-search-panel{
  top:180px;
  left:18px;

  display:flex;
  align-items:center;
  gap:5px;

  padding:6px 7px;
}

.city-search-panel input{
  width:140px;
  padding:6px 7px;
  font-size:13px;
}

/* 市町村名を「検索」ボタン */
.city-search-panel button{
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.city-name-label-icon{
  width:0 !important;
  height:0 !important;
  background:none;
  border:none;
  pointer-events:none;
}

.city-name-label-text{
  display:block;
  width:max-content;
  transform:translate(-50%, -50%);
  padding:2px 5px;
  background:rgba(255,255,255,.82);
  color:#222;
  border:1px solid rgba(0,0,0,.2);
  border-radius:5px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  font-size:13px;
  font-weight:bold;
  line-height:1.25;
  white-space:nowrap;
  text-shadow:
    1px 1px 0 #fff,
    -1px 1px 0 #fff,
    1px -1px 0 #fff,
    -1px -1px 0 #fff;
}

.city-name-label-text.main-city{
  padding:3px 6px;
  border-color:rgba(255,152,0,.7);
  font-size:15px;
}

.contact-panel{
  top:65px;
  right:15px;
  width:auto;
  padding:8px 14px;
  display:inline-block;
}

.contact-panel button{
  width:auto;
  padding:6px 10px;
  font-size:13px;
  margin:0 auto;
  display:block;
}

.admin-history-panel{
  top:115px;
  right:15px;
  width:210px;
  height:220px;
  overflow:hidden;
  font-size:13px;
  line-height:1.5;
}

.history-title{
  margin-bottom:4px;
  cursor:pointer;
}

.history-toggle-hint{
  font-size:11px;
  color:#888;
  margin-left:6px;
}

#adminHistoryContent{
  height:180px;
  overflow-y:auto;
}

.history-item{
  border-bottom:1px solid #bbb;
  padding:8px 0;
  margin-bottom:6px;
}

.scroll-hint{
  height:18px;
  line-height:18px;
  text-align:center;
  font-size:11px;
  color:#888;
  border-top:1px solid #eee;
}

.id-search-panel{
  top:350px;
  right:15px;
  width:210px;
  padding:10px;   /* ← 修正履歴と同じにする */
}

.id-search-panel input{
  width:135px;
  padding:5px;
  font-size:12px;
}

.id-search-panel button{
  padding:5px 8px;
  font-size:12px;
}

.id-search-count{
  font-size:11px;
  color:#666;
  margin-top:4px;
  text-align:center;
}

.reset-panel{
  bottom:20px;
  left:20px;
}

.parent-link-panel{
  bottom:58px;
  left:20px;
  padding:4px 8px;
}

.parent-link-panel button{
  font-size:12px;
  padding:5px 8px;
}

/* ズームボタンを「全体表示に戻る」の上へ */
.leaflet-bottom.leaflet-left{
  bottom:52px;
}

/* =========================
   ポップアップ
========================= */
.area-detail-popup{
  display:none;
  position:fixed;
  left:50%;
  top:50%;
  z-index:2500;

  width:min(276px, 72vw);
  max-height:75vh;
  box-sizing:border-box;
  overflow-y:auto;

  padding:18px 16px 14px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);

  font-size:13px;
  line-height:1.5;
}

.area-detail-popup::after{
  content:"";
  position:fixed;
  left:var(--area-detail-arrow-x, -100px);
  top:var(--area-detail-arrow-y, -100px);
  transform:translateX(-50%);
  border:10px solid transparent;
  border-top-color:#fff;
  pointer-events:none;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.18));
}

.area-detail-popup.popup-below::after{
  border-top-color:transparent;
  border-bottom-color:#fff;
  transform:translate(-50%, -20px);
}

.area-detail-popup.manually-moved::after{
  display:none;
}

.area-detail-popup.screen-positioned::after{
  display:none;
}

.area-detail-drag-handle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;

  margin:-18px -16px 10px;
  padding:7px 7px 7px 10px;

  background:#fff4df;
  border-bottom:2px solid #ff9800;
  border-radius:12px 12px 0 0;

  font-weight:bold;
  cursor:grab;
  user-select:none;
  touch-action:none;
}

.area-detail-drag-handle:active,
.area-detail-drag-handle.dragging{
  cursor:grabbing;
  background:#ffe7bd;
}

.area-detail-drag-label{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.area-detail-title{
  white-space:nowrap;
}

.area-detail-move-hint{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 7px;
  background:#ff9800;
  color:#fff;
  border-radius:999px;
  font-size:10px;
  line-height:1.2;
  white-space:nowrap;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  animation:dragHintMove 1.2s ease 2;
}

.area-detail-grip{
  font-size:14px;
  line-height:1;
}

.area-detail-close{
  flex:0 0 auto;
  width:26px;
  height:26px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#555;
  font-size:20px;
  line-height:26px;
  cursor:pointer;
}

.area-detail-close:hover{
  background:#f1f1f1;
}

.area-detail-popup .popup-main-info{
  font-size:14px;
  line-height:1.55;
}

@keyframes dragHintMove{
  0%, 100%{ transform:translateX(0); }
  35%{ transform:translateX(3px); }
  70%{ transform:translateX(-2px); }
}

.popup-admin-btn{
  background:#eeeeee;
  border:1px solid #cccccc;
  color:#444444;
  font-size:12px;
  padding:4px 8px;
  border-radius:4px;
  cursor:pointer;
}

.popup-admin-btn:hover{
  background:#e2e2e2;
}

/* =========================
   Leaflet Draw 日本語表示
========================= */
.leaflet-draw-actions a[title="Finish drawing"],
.leaflet-draw-actions a[title="Cancel drawing"],
.leaflet-draw-actions a[title="Delete last point"]{
  font-size:0;
}

.leaflet-draw-actions a[title="Finish drawing"]::after{
  content:"囲み終わり";
  font-size:13px;
}

.leaflet-draw-actions a[title="Cancel drawing"]::after{
  content:"キャンセル";
  font-size:13px;
}

.leaflet-draw-actions a[title="Delete last point"]::after{
  content:"1つ戻る";
  font-size:13px;
}

.leaflet-draw-draw-polygon{
  width:auto !important;
  background:none !important;
}

.leaflet-draw-draw-polygon span{
  display:none;
}

.leaflet-draw-draw-polygon::after{
  content:"エリアを作図";
  font-size:17px;
  padding:5px 10px;
  background:white;
  border-radius:6px;
  border:1px solid #ccc;
}


/* 「管理者修正履歴」のデザイン */
.history-title{
  font-size:15px;
  font-weight:bold;
  background:#f5f7fa;
  padding:4px 6px;
  border-radius:5px;
}
/* 「管理者修正履歴」のデザイン */


/* =========================
   スマホ中央ポイント作図UI
========================= */
.mobile-draw-start,
.mobile-draw-panel,
.map-center-cross{
  display:none;
}


/* =========================================
   凡例デザイン
========================================= */

.legend-panel{
  right:15px;
  bottom:50px;   /* PC：右下 */
  font-size:13px;
  line-height:1.6;
  padding:8px 10px;
}

/* 色四角 */
.legend-color{
  display:inline-block;
  width:14px;
  height:14px;
  margin-right:6px;
  border-radius:3px;
  vertical-align:middle;
}

.legend-color.planned{
  background:#0066ff;   /* 配布予定（青） */
}

.legend-color.done{
  background:#ff3333;   /* 配布済（赤） */
}


@media (max-width:600px) and (pointer:coarse){
  .area-detail-popup{
    width:min(264px, 72vw);
    max-height:60vh;
    padding:10px;
    font-size:12px;
  }

  .area-detail-drag-handle{
    margin:-10px -10px 6px;
    padding:4px 5px 4px 7px;
    border-radius:12px 12px 0 0;
  }

  .area-detail-drag-label{
    gap:4px;
  }

  .area-detail-move-hint{
    padding:2px 5px;
    font-size:9px;
  }

  .area-detail-grip{
    font-size:12px;
  }

  .area-detail-close{
    width:23px;
    height:23px;
    font-size:18px !important;
    line-height:23px;
  }

  .area-detail-popup .popup-main-info{
    font-size:12px;
    line-height:1.45;
  }

  .leaflet-draw{
    display:none !important;
  }

  .city-move-panel{
    left:50%;

    transform:translate(-50%, -50%);
    padding:8px 10px;
    font-size:12px;
    border-radius:8px;
    max-width:150px;
  }

  .city-move-panel button{
    font-size:11px !important;
    padding:6px 7px;
  }

  .city-candidate-box{

  }

  .city-candidate-title{
    margin-bottom:9px;
    font-size:14px;
  }

  .city-candidate-list{
    gap:6px;
  }

  .city-candidate-button{
    min-height:38px;
    padding:7px 4px;
    font-size:12px !important;
  }

  .city-candidate-cancel{
    margin-top:9px;
    padding:8px;
    font-size:12px !important;
  }

  #parentNotice{
    top:70px;
    left:10px;

    padding:8px 10px;

    font-size:12px;

    border-radius:8px;
  }

  .city-search-panel{
  top:130px;
  left:10px;

  padding:5px 6px;
  gap:4px;
}

.city-search-panel input{
  width:110px;
  padding:4px 5px;
  font-size:12px !important;
}

  .city-search-panel button{
  padding:4px 7px;
  font-size:12px !important;
}

  .city-name-label-text{
    padding:2px 4px;
    font-size:11px;
  }

  .city-name-label-text.main-city{
    padding:2px 5px;
    font-size:13px;
  }

  .mobile-draw-start{
    display:block;
    position:absolute;
    left:6px;
    top:55px;
    z-index:2000;
    background:white;
    padding:4px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,.3);
  }

  .mobile-draw-start button{

    font-size:8px;

    font-weight:bold;

    color:white;

    background:linear-gradient(#ff9f1a, #f58200);

    padding:4px 8px;

    border-radius:6px;

    border:2px solid white;

    box-shadow:0 2px 4px rgba(0,0,0,.25);

    text-shadow:0 1px 1px rgba(0,0,0,.25);

  }


  .mobile-draw-panel{
    display:none;
    position:absolute;
    left:6px;
    top:55px;
    z-index:2000;
    flex-direction:column;
    gap:4px;
    background:white;
    padding:6px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,.3);
  }

  .mobile-draw-panel button{
    font-size:12px !important;
    padding:5px 7px;
  }

  /* 「ここに点を追加」だけ目立たせる */

    background:linear-gradient(#4da3ff, #0066ff);

  }

  .title{
    top:8px;
    left:50%;
    right:auto;
    transform:translateX(-50%);

    width:max-content;
    max-width:92vw;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .contact-panel{
    top:55px;
    padding:3px 5px;
  }

  .contact-panel button{
    font-size:10px !important;
    padding:3px 6px !important;
  }

  .reset-panel{
    left:6px;
    bottom:80px;
    padding:5px;
  }

  .parent-link-panel{
    left:6px;
    bottom:122px;
    padding:5px;
  }

  .parent-link-panel button{
    font-size:11px;
    padding:5px 7px;
  }

  .reset-panel button{
    font-size:11px;
    padding:5px 7px;
  }

  .leaflet-bottom.leaflet-left{
    bottom:110px;

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ2yW7xLP6HMoljPtirqel_LsS5By4th4T-VjT1HJ5bv5IIM05CnvkhSyiEDl6Iv0Y/exec";

const params = new URLSearchParams(location.search);

const CURRENT_CITY = params.get("city") || "";

const IS_PARENT_PAGE = !CURRENT_CITY;

const INDEX_SELECTED_AREA_KEY =
  "selectedAreaFromIndex";

const isTouchDevice = window.matchMedia("(max-width:600px) and (pointer:coarse)").matches;
const map = L.map("map", { zoomControl:false }).setView([35.18,136.91], 8);

map.createPane("drawAreaPane");
map.getPane("drawAreaPane").style.zIndex = 450;

map.createPane("cityLabelPane");
map.getPane("cityLabelPane").style.zIndex = 460;
map.getPane("cityLabelPane").style.pointerEvents = "none";

L.control.zoom({ position:"bottomleft" }).addTo(map);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"©OpenStreetMap"
}).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const plannedItemsById = {};
const areaItemsById = {};
const areaLayersById = {};
let pendingAreaChoiceHandler = null;
let pendingAreaChoiceIds = [];
let areaChoicePreviewActive = false;

let currentRequestId = null;
let confirmCallback = null;
let confirmCancelCallback = null;
let areaFormResolver = null;
let doneFormResolver = null;
let mobileDrawing = false;
let mobilePoints = [];
let mobilePreviewLayer = null;
let ignoreNextClick = false;

let selectedCityName = null;
let selectedCityUrl = null;

const cityBoundaryLayers = {};
let selectedCityNameLabelMarkers = [];
let highlightedCityLayer = null;
let keepHighlightOnNextMapClick = false;

let highlightedAreaLayer = null;
let highlightedAreaId = null;
let keepAreaHighlightOnNextMapClick = false;

let areaDetailCurrentLayer = null;
let areaPopupDragging = false;
let areaPopupDragStartX = 0;
let areaPopupDragStartY = 0;
let areaPopupStartLeft = 0;
let areaPopupStartTop = 0;

// =========================
// Leaflet Draw 日本語化
// =========================
L.drawLocal.draw.toolbar.buttons.polygon = "エリアを作図";
L.drawLocal.draw.handlers.polygon.tooltip.start = "地図をクリックして配布エリアの1点目を決めてください";
L.drawLocal.draw.handlers.polygon.tooltip.cont = "続けてクリックして範囲を囲んでください。最初の点をクリックすると範囲が確定します";
L.drawLocal.draw.handlers.polygon.tooltip.end = "最初の点をクリックすると範囲が確定します";
L.drawLocal.draw.handlers.polygon.finish = {
  title:"この範囲で登録します",
  text:"この範囲で登録"
};
L.drawLocal.draw.toolbar.undo = {
  title:"直前の点を削除",
  text:"1つ戻る"
};
L.drawLocal.draw.toolbar.cancel = {
  title:"描画を中止します",
  text:"キャンセル"
};

const drawControl = new L.Control.Draw({
  position:"topleft",
  draw:{
    polygon:true,
    rectangle:false,
    circle:false,
    marker:false,
    polyline:false,
    circlemarker:false
  },
  edit:{
    featureGroup:drawnItems,
    edit:false,
    remove:false
  }
});


document.getElementById("mobileDrawStart").style.display = "none";
document.getElementById("mobileDrawPanel").style.display = "none";
document.getElementById("mapCenterCross").style.display = "none";

if(IS_PARENT_PAGE){
  document.getElementById("parentLinkPanel").style.display = "none";
}


// =========================
// 初期読み込み
// =========================
fetch("aichi.geojson")
  .then(res => res.json())
  .then(data => {

    const filteredFeatures = IS_PARENT_PAGE
      ? data.features.filter(f =>
        f.properties.N03_004 &&
        f.properties.N03_004 !== "所属未定地"
    　)
    : data.features.filter(f =>
        f.properties.N03_004 === CURRENT_CITY
      );

  
    const filteredGeoJson = {
      type:"FeatureCollection",
      features:filteredFeatures
    };

    const boundary = L.geoJSON(filteredGeoJson, {

      style:{
        color:"#000",
        weight:2,
        fill:true,
        fillColor:"#dddddd",
        fillOpacity:0.5
      },

      onEachFeature:function(feature, layer){

        const boundaryCityName = feature.properties.N03_004;

        if(boundaryCityName){
          cityBoundaryLayers[boundaryCityName] = layer;
        }

        if(IS_PARENT_PAGE){

          layer.on("click", function(){

            const cityName = feature.properties.N03_004;

            if(!cityName) return;

            clearCityHighlight();

            layer.setStyle({
              color:"#ffd600",
              weight:6
            });

function drawLayer(item){

  const layer = L.geoJSON(item.geo, {

    pane:"drawAreaPane",
    interactive:true,

    style:{
      color:getColor(item.row["種類"]),
      fillColor:getColor(item.row["種類"]),
      fillOpacity:item.row["種類"] === "配布済" ? 0.5 : 0.35
    }

  }).addTo(drawnItems);

  const id = item.row["ID"];
  const isPlanned = item.row["種類"] === "配布予定";

  areaItemsById[id] = item;
  areaLayersById[id] = layer;

  if(isPlanned){
    plannedItemsById[id] = item;
  }

  if(IS_PARENT_PAGE){
    layer.on("click", function(e){

      L.DomEvent.stopPropagation(e);

      handleOverlappingAreaClick(
        id,
        e.latlng,
        selectParentAreaById
      );
    });

  }else{

    layer.bindPopup(
      makePopupHtml(item.row, isPlanned)
    );

    layer.on("click", function(){

      map.fitBounds(layer.getBounds(), {
        padding:[40, 40]
      });
    });
  }
}

  fetch(SCRIPT_URL, {

    body:JSON.stringify({
      pass:formData.pass,
      city:CURRENT_CITY,
      type:formData.type,
      date:formData.date,
      count:formData.count,
      person:formData.person,
      note:formData.note,
      geometry:geo
    })
  })
  .then(res => res.json())
  .then(result => {
    if(result.status !== "OK"){
      alert("合言葉が違います");
      return;
    }

    layer.setStyle({
      color:getColor(formData.type),
      fillColor:getColor(formData.type),
      fillOpacity:formData.type === "配布済" ? 0.5 : 0.35
    });

    drawnItems.addLayer(layer);

    const newRow = {
      "ID":result.id,
      "登録日時":new Date(),
      "種類":formData.type,
      "実施日":formData.date,
      "枚数":formData.count,
      "担当者":formData.person,
      "備考":formData.note
    };

    const isPlanned = formData.type === "配布予定";
    const item = { geo, row:newRow };

    areaItemsById[newRow["ID"]] = item;
    areaLayersById[newRow["ID"]] = layer;

      plannedItemsById[newRow["ID"]] = item;

    layer.bindPopup(makePopupHtml(newRow, isPlanned));

      map.fitBounds(layer.getBounds(), {

      });
    });

    openPopupAbove(layer);
  });

// =========================
// ポップアップ・表示
// =========================
function getColor(type){
  if(type === "配布済") return "#ff3333";
  if(type === "配布予定") return "#0066ff";
  return "#999";
}

function formatDateSimple(value){
  if(!value) return "";

  const d = new Date(value);
  if(isNaN(d)) return value;

  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
}
function isLeafletLatLng(value){
  return (
    value &&
    typeof value.lat === "number" &&
    typeof value.lng === "number"
  );
}

function isLatLngInRing(point, ring){

  let inside = false;

  for(
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ){

    const current = ring[i];
    const previous = ring[j];

    const crossesLatitude =
      (current.lat > point.lat) !==
      (previous.lat > point.lat);

    const intersectionLng =
      (
        (previous.lng - current.lng) *
        (point.lat - current.lat)
      ) /
      (previous.lat - current.lat) +
      current.lng;

    if(
      crossesLatitude &&
      point.lng < intersectionLng
    ){
      inside = !inside;
    }
  }

  return inside;
}

function isLatLngInPolygonShape(point, latlngs){

  if(!Array.isArray(latlngs) || !latlngs.length){
    return false;
  }

  if(isLeafletLatLng(latlngs[0])){
    return isLatLngInRing(point, latlngs);
  }

  if(
    Array.isArray(latlngs[0]) &&
    isLeafletLatLng(latlngs[0][0])
  ){

    if(!isLatLngInRing(point, latlngs[0])){
      return false;
    }

    return !latlngs
      .slice(1)
      .some(hole => isLatLngInRing(point, hole));
  }

  return latlngs.some(
    polygon =>
      isLatLngInPolygonShape(point, polygon)
  );
}

function isLatLngInsideAreaLayer(point, areaLayer){

  let isInside = false;

  function inspectLayer(layer){

    if(isInside) return;

    if(
      layer instanceof L.Polygon &&
      typeof layer.getLatLngs === "function"
    ){
      isInside = isLatLngInPolygonShape(
        point,
        layer.getLatLngs()
      );
      return;
    }

    if(typeof layer.eachLayer === "function"){
      layer.eachLayer(inspectLayer);
    }
  }

  inspectLayer(areaLayer);
  return isInside;
}

function getAreaIdsAtLatLng(latlng){

  return Object.keys(areaLayersById)
    .filter(id => {

      const layer = areaLayersById[id];

      return (
        layer &&
        isLatLngInsideAreaLayer(latlng, layer)
      );
    });
}

  ).style.display = "none";

  }

  pendingAreaChoiceIds = [];

function showAreaChoiceOverlay(areaIds, onSelect){

  const overlay =
    document.getElementById("areaChoiceOverlay");

  const list =
    document.getElementById("areaChoiceList");

  list.innerHTML = "";
  pendingAreaChoiceHandler = onSelect;
  pendingAreaChoiceIds = areaIds.slice();

  areaIds
    .slice()
    .sort((idA, idB) => {

      const typeA =
        areaItemsById[idA]?.row?.["種類"] || "";

      const typeB =
        areaItemsById[idB]?.row?.["種類"] || "";

      if(typeA === typeB) return 0;
      if(typeA === "配布予定") return -1;
      if(typeB === "配布予定") return 1;
      return typeA.localeCompare(typeB, "ja");
    })
    .forEach(id => {

      const item = areaItemsById[id];
      if(!item) return;

      const row = item.row;
      const type = row["種類"] || "種類未入力";

      const button =
        document.createElement("button");

      button.type = "button";
      button.className =
        "area-choice-button " +
        (
          type === "配布予定"
            ? "planned"
            : type === "配布済"
              ? "done"
              : ""
        );

      const typeText =
        document.createElement("span");

      typeText.className = "area-choice-type";
      typeText.textContent = type;

      const metaText =
        document.createElement("span");

      metaText.className = "area-choice-meta";

      const dateText =
        formatDateSimple(row["実施日"]) ||
        "未入力";

      const countText =
        row["枚数"] !== "" &&
        row["枚数"] !== null &&
        row["枚数"] !== undefined
          ? row["枚数"] + "枚"
          : "未入力";

      const shortId =
        String(id).length > 16
          ? String(id).slice(0, 16) + "…"
          : String(id);

      metaText.textContent =
        "日付：" + dateText +
        "　枚数：" + countText +
        "　ID：" + shortId;

      button.appendChild(typeText);
      button.appendChild(metaText);

      button.addEventListener("click", function(){

        const handler =
          pendingAreaChoiceHandler;

        const choiceIds =
          pendingAreaChoiceIds.slice();

        closeAreaChoiceOverlay(false);

        if(handler){
          confirmAreaChoiceSelection(
            id,
            choiceIds,
            handler
          );
        }
      });

      list.appendChild(button);
    });

  overlay.style.display = "flex";
}

function handleOverlappingAreaClick(
  clickedId,
  latlng,
  selectArea
){

  const areaIds =
    getAreaIdsAtLatLng(latlng);

  if(!areaIds.includes(clickedId)){
    areaIds.unshift(clickedId);
  }

  if(areaIds.length <= 1){
    selectArea(areaIds[0]);
    return;
  }

  showAreaChoiceOverlay(
    areaIds,
    selectArea
  );
}


function openParentAreaDetail(row, layer){

// エリア詳細ボックスの出現位置
function positionAreaDetailPopup(layer){
  const popup = document.getElementById("areaDetailPopup");

  if(!layer || popup.style.display === "none") return;
  if(popup.classList.contains("manually-moved")) return;

  const popupWidth = popup.offsetWidth;
  const popupHeight = popup.offsetHeight;
  const edge = 8;

  const isMobile = window.matchMedia(
    "(max-width:600px) and (pointer:coarse)"
  ).matches;

  let left;
  let top;

  if(isMobile){

    // スマホ：画面右上（上部タイトルの下）
    left = window.innerWidth - popupWidth - edge;
    top = 55;

  }else{

    // パソコン：左から25％、上下中央より少し上
    left =
      window.innerWidth * 0.2 -
      popupWidth / 2;

    top =
      window.innerHeight * 0.47 -
      popupHeight / 2;
  }

  left = Math.max(
    edge,
    Math.min(
      left,
      window.innerWidth - popupWidth - edge
    )
  );

  top = Math.max(
    edge,
    Math.min(
      top,
      window.innerHeight - popupHeight - edge
    )
  );

  popup.style.left = left + "px";
  popup.style.top = top + "px";
  popup.classList.remove("popup-below");
}

function closeAreaDetailPopup(clearHighlight){
  const popup = document.getElementById("areaDetailPopup");

  popup.style.display = "none";
  popup.style.visibility = "hidden";
  popup.setAttribute("aria-hidden", "true");
  popup.classList.remove(
    "manually-moved",
    "popup-below",
    "screen-positioned"
  );
  areaDetailCurrentLayer = null;

  if(clearHighlight !== false){
    clearAreaHighlight();
    clearSelectedCityNameLabel();
  }
}

function selectParentAreaById(id){

function startAreaPopupDrag(e){
  if(e.button !== undefined && e.button !== 0) return;
  if(e.target.closest(".area-detail-close")) return;

  const popup = document.getElementById("areaDetailPopup");
  const handle = document.getElementById("areaDetailDragHandle");
  const rect = popup.getBoundingClientRect();

  areaPopupDragging = true;
  areaPopupDragStartX = e.clientX;
  areaPopupDragStartY = e.clientY;
  areaPopupStartLeft = rect.left;
  areaPopupStartTop = rect.top;

  popup.classList.add("manually-moved");
  handle.classList.add("dragging");

  if(handle.setPointerCapture){
    handle.setPointerCapture(e.pointerId);
  }

  e.preventDefault();
}

function moveAreaPopup(e){
  if(!areaPopupDragging) return;

  const popup = document.getElementById("areaDetailPopup");
  const edge = 6;

  let left = areaPopupStartLeft + (e.clientX - areaPopupDragStartX);
  let top = areaPopupStartTop + (e.clientY - areaPopupDragStartY);

  left = Math.max(edge, Math.min(left, window.innerWidth - popup.offsetWidth - edge));
  top = Math.max(edge, Math.min(top, window.innerHeight - popup.offsetHeight - edge));

  popup.style.left = left + "px";
  popup.style.top = top + "px";
  e.preventDefault();
}

function stopAreaPopupDrag(e){
  if(!areaPopupDragging) return;

  areaPopupDragging = false;
  document.getElementById("areaDetailDragHandle").classList.remove("dragging");

  if(e && e.preventDefault){
    e.preventDefault();
  }
}

function openPopupAbove(layer){
  const bounds = layer.getBounds();
  const topCenter = L.latLng(
    bounds.getNorth(),
    (bounds.getEast() + bounds.getWest()) / 2
  );

  layer.openPopup(topCenter);
}

function makePopupHtml(row, isPlanned){

  let html =
    `<div class="popup-main-info">` +
    "種類：" + (row["種類"] || "") + "<br>" +
    "実施日：" + formatDateSimple(row["実施日"]) + "<br>" +
    "枚数：" + (row["枚数"] || "") + "<br>" +
    "担当：" + (row["担当者"] || "") + "<br>" +
    "備考：" + (row["備考"] || "") +
    `</div>`;


  if(isPlanned){

    let baseDate;

    if(row["登録日時"]){
      baseDate = new Date(row["登録日時"]);
    }else{
      baseDate = new Date(); // 登録直後用
    }

    if(!isNaN(baseDate)){

      const deleteDate = new Date(baseDate);
      deleteDate.setDate(deleteDate.getDate() + 7);

      html +=
        "<div style='margin-top:8px; font-size:12px; color:#cc0000;'>"
        + "このエリアは "
        + deleteDate.getFullYear() + "/"
        + (deleteDate.getMonth()+1) + "/"
        + deleteDate.getDate()
        + " に自動削除予定です"
        + "</div>";
    }

    html += `<br>
      <button onclick="convertPlannedToDone('${row["ID"]}')">配布済にする</button>`;
  }


  html += `<br><br>
    <button class="popup-admin-btn" onclick="openRequestMenu('${row["ID"]}')">管理者へ修正依頼</button>`;


  html += `
    <hr style="margin:10px 0; border:none; border-top:1px dashed #ccc;">
    <div style="font-size:12px; color:#666;">
      管理者用ID：${row["ID"]}<br>
      <button class="popup-admin-btn"
      onclick="copyAreaId('${row["ID"]}')"
      style="margin-top:4px; font-size:11px;">IDをコピー</button>
    </div>`;

  return html;
}

// 配布予定 → 配布済
// =========================
async function convertPlannedToDone(id){
  const item = plannedItemsById[id];

  if(!item){
    alert("配布予定データが見つかりません");
    return;
  }

  const formData = await openDoneForm(item.row);
  if(!formData) return;

  fetch(SCRIPT_URL, {
    method:"POST",
    body:JSON.stringify({
      pass:formData.pass,
      id:id + "（2）",
      baseId:id,
      city:CURRENT_CITY,
      type:"配布済",
      date:formData.date,
      count:formData.count,
      person:formData.person,
      note:formData.note,
      geometry:item.geo
    })
  })
  .then(res => res.json())
  .then(result => {
    if(result.status !== "OK"){
      alert("合言葉が違います");
      return;
    }

    const doneLayer = L.geoJSON(item.geo, {
      style:{
        color:getColor("配布済"),
        fillColor:getColor("配布済"),
        fillOpacity:0.5
      }
    }).addTo(drawnItems);

    const doneRow = {
      "ID":id + "（2）",
      "種類":"配布済",
      "実施日":formData.date,
      "枚数":formData.count,
      "担当者":formData.person,
      "備考":formData.note
    };

    const doneItem = { geo:item.geo, row:doneRow };
    areaItemsById[doneRow["ID"]] = doneItem;
    areaLayersById[doneRow["ID"]] = doneLayer;

    doneLayer.bindPopup(makePopupHtml(doneRow, false));
    doneLayer.on("click", function(){
      map.fitBounds(doneLayer.getBounds(), {
        padding:[40, 40],
      });
    });

    openPopupAbove(doneLayer);
  });
}

function splitDateValue(value){
  if(!value) return { year:"", month:"", day:"" };

  const d = new Date(value);

  if(!isNaN(d)){
    return {
      year:String(d.getFullYear()),
      month:String(d.getMonth() + 1),
      day:String(d.getDate())
    };
  }

  const parts = String(value).split("/");
  return {
    year:parts[0] || "",
    month:parts[1] || "",
    day:parts[2] || ""
  };
}

function addSelectedCityNameLabel(cityName, layer){

  if(!cityName || !layer) return;

  const labelElement =
    document.createElement("span");

  labelElement.className =
    "city-name-label-text main-city";

  labelElement.textContent = cityName;

  const marker = L.marker(
    layer.getBounds().getCenter(),
    {
      pane:"cityLabelPane",
      interactive:false,
      keyboard:false,
      icon:L.divIcon({
        className:"city-name-label-icon",

function showAreaRelatedCityNameLabels(row){

  clearSelectedCityNameLabel();

  const cityNames = [];

  String(row["表示市町村"] || "")
    .split("|")
    .map(name => name.trim())
    .filter(Boolean)
    .forEach(name => cityNames.push(name));

  const primaryCity =
    String(row["市町村"] || "").trim();

  if(primaryCity){
    cityNames.push(primaryCity);
  }

  Array.from(new Set(cityNames))
    .forEach(cityName => {
      addSelectedCityNameLabel(
        cityName,
        cityBoundaryLayers[cityName]

    });

function showCityCandidateOverlay(candidates){

  const overlay =
    document.getElementById("cityCandidateOverlay");

  const list =
    document.getElementById("cityCandidateList");

  list.innerHTML = "";

  candidates
    .slice()
    .sort((a, b) => a.localeCompare(b, "ja"))
    .forEach(cityName => {

      const button = document.createElement("button");

      button.type = "button";
      button.className = "city-candidate-button";
      button.textContent = cityName;

      button.addEventListener("click", function(){
        closeCityCandidateOverlay();
        showCitySearchResult(cityName);
      });

      list.appendChild(button);
    });

  overlay.style.display = "flex";
}

function showCitySearchResult(cityName){

  clearCityHighlight();

  const layer = cityBoundaryLayers[cityName];

  if(!layer){
    alert("該当する市町村が見つかりませんでした");
    return;
  }

  layer.setStyle({
    color:"#ffd600",
    weight:6
  });

  layer.on("click", keepCityHighlight);
  layer.bringToFront();

  highlightedCityLayer = layer;

  showSelectedCityNameLabel(
    cityName,
    layer
  );

  document.getElementById(
    "citySearchInput"
  ).value = cityName;

  map.fitBounds(
    layer.getBounds(),
    getCityFitOptions()
  );
}


function searchCity(){

  const input = document.getElementById("citySearchInput");
  const keyword = input.value.trim();

  if(!keyword){
    alert("市町村名を入力してください");
    input.focus();
    return;
  }

  const cityNames = Object.keys(cityBoundaryLayers);

  let matchedCityName =
    cityNames.find(name => name === keyword);

  if(!matchedCityName){

    const candidates =
      cityNames.filter(name => name.includes(keyword));

    if(candidates.length === 1){

      matchedCityName = candidates[0];

    }else if(candidates.length > 1){
      showCityCandidateOverlay(candidates);
      return;
    }
  }

  if(!matchedCityName){
    alert("該当する市町村が見つかりませんでした");
    return;
  }

  showCitySearchResult(matchedCityName);
}

function goToAreaCity(cityName, areaId){

  if(!cityName){
    alert("市町村情報が登録されていません");
    return;
  }

  // 移動先の市ページで同じエリアを1回だけ復元する
  try{

    sessionStorage.setItem(
      INDEX_SELECTED_AREA_KEY,
      JSON.stringify({
        id:String(areaId || ""),
        city:String(cityName),
        savedAt:Date.now()
      })
    );

  }catch(error){
    // 一時保存できなくても、市ページへの移動自体は止めない
    console.warn("選択エリアを一時保存できませんでした", error);
  }

  location.href =
    "map.html?city=" +
    encodeURIComponent(cityName);
}

function searchAreaById(){

  const keyword =
    document.getElementById("idSearchInput").value.trim();

  const countBox =
    document.getElementById("idSearchResultCount");

  if(!keyword){

    alert("IDを入力してください");
    countBox.textContent = "";
    return;
  }

  const matchedIds =
    Object.keys(areaLayersById)
      .filter(id => id.includes(keyword));

  countBox.textContent = matchedIds.length + "件";

  if(matchedIds.length === 0){

    alert("該当するIDのエリアが見つかりませんでした");
    return;
  }

  clearCityHighlight();
  clearAreaHighlight();

  const matchedId = matchedIds[0];
  const layer = areaLayersById[matchedId];
  const item = areaItemsById[matchedId];

  layer.setStyle({
    color:"#ffd600",
    weight:6
  });

  layer.bringToFront();

  highlightedAreaLayer = layer;
  highlightedAreaId = matchedId;

  showAreaRelatedCityNameLabels(item.row);

  map.fitBounds(layer.getBounds(), {
    padding:[60, 60]
  });

  openParentAreaDetail(item.row, layer);
}

  if(e.touches.length >= 2){
    ignoreNextClick = true;
  }
}, { passive:true });

map.getContainer().addEventListener("touchend", function(){
  setTimeout(function(){
    ignoreNextClick = false;
  }, 300);
}, { passive:true });

map.on("click", function(e){

  if(ignoreNextClick){

    if(e.originalEvent){
      e.originalEvent.stopPropagation();
    }

    return;
  }

  if(keepAreaHighlightOnNextMapClick){

    keepAreaHighlightOnNextMapClick = false;
    return;
  }

  if(keepHighlightOnNextMapClick){

    keepHighlightOnNextMapClick = false;

    clearAreaHighlight();
    closeAreaDetailPopup(false);
    map.closePopup();

    return;
  }

  clearCityHighlight();
  clearAreaHighlight();
  closeAreaDetailPopup(false);
  map.closePopup();
});
