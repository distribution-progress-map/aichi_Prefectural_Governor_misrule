<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【愛知県】大村知事悪政周知チラシ　配布エリア共有マップ</title>

<!-- 外部データの接続準備を先に始める -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<style>
/* =========================
   基本
========================= */
html,
body{
  height:100%;
  margin:0;
}

#map{
  height:100%;
}



.panel{
  position:absolute;
  background:white;
  padding:10px;
  z-index:1000;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.3);
}

.title{
  top:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:bold;
}

.error-text{
  color:red;
  font-size:13px;
  margin-top:4px;
  margin-bottom:8px;
  font-weight:bold;
}

.confirm-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.35);

  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;
}

.confirm-box{
  width:min(320px, 85vw);

  background:white;

  border-radius:14px;

  padding:18px 16px;

  box-shadow:0 8px 24px rgba(0,0,0,0.35);

  text-align:center;
}

.confirm-message{
  font-size:16px;
  font-weight:bold;

  line-height:1.6;

  margin-bottom:18px;

  color:#333;
}

.confirm-buttons{
  display:flex;
  gap:10px;
}

.confirm-buttons button{
  flex:1;

  padding:10px 0;

  border:none;

  border-radius:8px;

  font-size:15px;
  font-weight:bold;
}

#confirmOkButton{
  background:#ff9800;
  color:white;
}

#confirmCancelButton{
  background:#e0e0e0;
  color:#333;
}
.area-choice-box{
  width:min(400px, calc(100vw - 32px));
  max-height:80vh;
  overflow:hidden;
  background:white;
  border-radius:14px;
  padding:16px;
  box-sizing:border-box;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.area-choice-title{
  margin-bottom:10px;
  color:#333;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}

.area-choice-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:55vh;
  overflow-y:auto;
  padding:2px;
}

.area-choice-button{
  width:100%;
  padding:9px 10px;
  background:#fff;
  color:#333;
  border:1px solid #ccc;
  border-left:6px solid #999;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
}

.area-choice-button.planned{
  border-left-color:#0066ff;
  background:#f4f8ff;
}

.area-choice-button.done{
  border-left-color:#ff3333;
  background:#fff5f5;
}

.area-choice-type{
  display:block;
  margin-bottom:3px;
  font-size:14px;
  font-weight:bold;
}

.area-choice-meta{
  display:block;
  color:#555;
  font-size:12px;
  line-height:1.45;
}

.area-choice-cancel{
  width:100%;
  margin-top:12px;
  padding:9px;
  background:#e0e0e0;
  color:#333;
  border:none;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}


/* =========================
   モーダル
========================= */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:420px;
  padding:18px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.35);
  font-size:15px;
}

.modal-box h3{
  margin-top:0;
}

.modal-box label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

.modal-box label span{
  color:#888;
  font-weight:normal;
  font-size:12px;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  box-sizing:border-box;
  padding:8px;
  margin-top:4px;
}

.date-row{
  display:flex;
  gap:6px;
}

.date-row select{
  width:33.3%;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-buttons button{
  flex:1;
  padding:10px;
}

/* 市町村移動先の選択 */
.transfer-city-message{
  margin:0 0 14px;
  color:#555;
  font-size:14px;
  line-height:1.6;
}

.transfer-city-buttons{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  margin-top:12px;
}

.transfer-city-button{
  padding:11px 6px;
  border:none;
  border-radius:8px;
  background:#ff9800;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.transfer-city-button:hover{
  background:#f57c00;
}

.transfer-city-cancel{
  width:100%;
  margin-top:14px;
  padding:10px;
  border:1px solid #cccccc;
  border-radius:8px;
  background:#eeeeee;
  color:#333;
  font-weight:bold;
  cursor:pointer;
}

/* 修正依頼フォームの日付欄だけ縦並び */
#requestFormModal .date-row{
  display:block;
}

#requestFormModal .date-row select{
  width:100%;
  margin-bottom:6px;
}

/* =========================
   各パネル
========================= */
.contact-panel{
  top:65px;
  right:15px;
  width:auto;
  padding:8px 14px;
  display:inline-block;
}

.contact-panel button{
  width:auto;
  padding:6px 10px;
  font-size:13px;
  margin:0 auto;
  display:block;
}

.admin-history-panel{
  top:115px;
  right:15px;
  width:210px;
  height:220px;
  overflow:hidden;
  font-size:13px;
  line-height:1.5;
}

.history-title{
  margin-bottom:4px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  background:#f5f7fa;
  padding:4px 6px;
  border-radius:5px;
}

.history-toggle-hint{
  font-size:11px;
  color:#888;
  margin-left:6px;
}

#adminHistoryContent{
  height:180px;
  overflow-y:auto;
}

.history-item{
  border-bottom:1px solid #bbb;
  padding:8px 0;
  margin-bottom:6px;
}

.scroll-hint{
  height:18px;
  line-height:18px;
  text-align:center;
  font-size:11px;
  color:#888;
  border-top:1px solid #eee;
}

.id-search-panel{
  top:350px;
  right:15px;
  width:210px;
  padding:10px;   /* ← 修正履歴と同じにする */
}

.id-search-panel input{
  width:135px;
  padding:5px;
  font-size:12px;
}

.id-search-panel button{
  padding:5px 8px;
  font-size:12px;
}

.id-search-count{
  font-size:11px;
  color:#666;
  margin-top:4px;
  text-align:center;
}

.reset-panel{
  bottom:20px;
  left:20px;
}

/* 「県全体へ戻る」ボタン */
.parent-link-panel{
  bottom:67px;
  left:20px;
  padding:4px 8px;
}

.parent-link-panel button,
.reset-panel button{
  font-size:13px;
  padding:5px 8px;
}

.parent-link-panel button{
  font-weight:bold;
  border-width:1.5px;
}

/* ズームボタンを「全体表示に戻る」の上へ。＋－ボタン */
.leaflet-bottom.leaflet-left{
  bottom:110px;
}

/* =========================
   ポップアップ
========================= */
.popup-admin-btn{
  background:#eeeeee;
  border:1px solid #cccccc;
  color:#444444;
  font-size:12px;
  padding:4px 8px;
  border-radius:4px;
  cursor:pointer;
}

.popup-admin-btn:hover{
  background:#e2e2e2;
}

/* =========================
   Leaflet Draw 日本語表示
========================= */
.leaflet-draw-actions a[title="Finish drawing"],
.leaflet-draw-actions a[title="Cancel drawing"],
.leaflet-draw-actions a[title="Delete last point"]{
  font-size:0;
}

.leaflet-draw-actions a[title="Finish drawing"]::after{
  content:"囲み終わり";
  font-size:13px;
}

.leaflet-draw-actions a[title="Cancel drawing"]::after{
  content:"キャンセル";
  font-size:13px;
}

.leaflet-draw-actions a[title="Delete last point"]::after{
  content:"1つ戻る";
  font-size:13px;
}

.leaflet-draw-draw-polygon{
  width:auto !important;
  background:none !important;
}

.leaflet-draw-draw-polygon span{
  display:none;
}

.leaflet-draw-draw-polygon::after{
  content:"エリアを作図";
  font-size:17px;
  padding:5px 10px;
  background:white;
  border-radius:6px;
  border:1px solid #ccc;
}


/* =========================
   スマホ中央ポイント作図UI
========================= */
.mobile-draw-start,
.mobile-draw-panel,
.map-center-cross{
  display:none;
}


/* =========================================
   凡例デザイン
========================================= */

/* 凡例 */
.legend-panel{
  right:15px;
  top:auto;

  left:auto;
  bottom:50px;

  font-size:13px;
  line-height:1.6;
  padding:8px 10px;
}

/* 色四角 */
.legend-color{
  display:inline-block;
  width:14px;
  height:14px;
  margin-right:6px;
  border-radius:3px;
  vertical-align:middle;
}

.legend-color.planned{
  background:#0066ff;   /* 配布予定（青） */
}

.legend-color.done{
  background:#ff3333;   /* 配布済（赤） */
}



@media (max-width:600px) and (pointer:coarse){
  .leaflet-draw{
    display:none !important;
  }



  /* 「エリアを作図」 */
  .mobile-draw-start{
    display:block;
    position:absolute;
    left:15px;
    top:55px;
    z-index:2000;
    background:white;
    padding:4px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,.3);
  }

  .mobile-draw-start button{

    font-size:8px;

    font-weight:bold;

    color:white;

    background:linear-gradient(#ff9f1a, #f58200);

    padding:4px 8px;

    border-radius:6px;

    border:2px solid white;

    box-shadow:0 2px 4px rgba(0,0,0,.25);

    text-shadow:0 1px 1px rgba(0,0,0,.25);

  }


  .mobile-draw-panel{
    display:none;
    position:absolute;
    left:6px;
    top:55px;
    z-index:2000;
    flex-direction:column;
    gap:4px;
    background:white;
    padding:6px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,.3);
  }

  .mobile-draw-panel button{
    font-size:12px !important;
    padding:5px 7px;
  }

  /* 「ここに点を追加」だけ目立たせる */
  .mobile-draw-panel button:first-child{

    background:linear-gradient(#4da3ff, #0066ff);

    color:white;

    font-weight:bold;

    border:2px solid white;

    box-shadow:0 2px 4px rgba(0,0,0,.25);

  }

  /* 「囲み終わり」の下に少し隙間 */
  .mobile-draw-panel button:nth-child(3){
    margin-bottom:8px;
  }

  .map-center-cross{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:1500;
    font-size:28px;
    font-weight:bold;
    color:#ff3333;
    pointer-events:none;
    text-shadow:0 0 3px white;
  }

  .title{
    top:8px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    font-size:12px;
    padding:6px 10px;
    width:max-content;
    max-width:92vw;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* 管理者へ連絡 */
  .contact-panel{
    top:55px;
    padding:3px 5px;
  }

  .contact-panel button{
    font-size:10px !important;
    padding:3px 6px !important;
  }

  /* 全体表示に戻る */
  .reset-panel{
    left:45px;
    bottom:10px;
    padding:4px 6px;
  }

  .parent-link-panel{
    left:6px;
    bottom:125px;
    padding:3px 4px;
  }

  .parent-link-panel button{
    font-size:10px;
    padding:3px 5px;
  }

  .reset-panel button{
    font-size:11px;
    padding:3px 6px;
  }

  .leaflet-bottom.leaflet-left{
    bottom:10px;
    left:6px;
  }

  .leaflet-bottom.leaflet-left .leaflet-control-zoom{
    margin-left:2px;     /* ← 左へ寄せる（小さくするほど左） */
    margin-bottom:0px;  /* ← 下へ寄せる（小さくするほど下） */
  }

  /* ID検索 */
  .id-search-panel input{
    width:82px;
    font-size:11px;
    padding:4px;
  }

  .id-search-panel button{
    font-size:11px;
    padding:4px 6px;
  }


  .id-search-panel{
    right:6px;
    bottom:10px;
    top:auto;

    width:145px;

    padding-top:5.5px;
    padding-bottom:5.5px;
    padding-left:6px;
    padding-right:6px;

    display:flex;
    align-items:center;
    gap:4px;
  }

  .id-search-count{
    order:-1;              /* 左に出す */
    font-size:9px;
    color:#666;
    margin-top:0;
    white-space:nowrap;    /* 1行固定 */
    min-width:max-content;
  }

  .history-title{
    font-size:10px;
  }

  .admin-history-panel{
    top:auto !important;
    bottom:55px !important;
    right:6px;
    width:145px;
    height:60px !important;
    max-height:none;
    font-size:11.5px;
    padding:6px;
    transition:height .2s;
  }

   
  .admin-history-panel.expanded{
    height:240px !important;
  }

  .admin-history-panel #adminHistoryContent{
    height:24px !important;
  }

  .admin-history-panel.expanded #adminHistoryContent{
    height:188px !important;
    overflow-y:auto;
  }

  .history-title{
    margin-bottom:2px;
  }

  .history-toggle-hint{
    font-size:10px;
  }

  .scroll-hint{
    height:14px;
    line-height:14px;
    font-size:9px;
  }

  .leaflet-popup-content{
    width:64vw !important;
    max-width:64vw !important;
    font-size:12px;
    line-height:1.4;
  }

  .leaflet-popup-content button{
    font-size:12px !important;
    padding:4px 7px !important;
  }

  .popup-main-info{
    font-size:110%;
    line-height:1.45;
  }

  input,
  select,
  textarea,
  button{
    font-size:16px !important;
  }

  .reset-panel button,
  .parent-link-panel button,
  .id-search-panel button,
  .contact-panel button{
    font-size:12px !important;
    line-height:1.2;
  }

  .id-search-panel button{
    width:48px;
    min-width:48px;
    padding:4px 2px !important;
  }

  .id-search-panel input{
    font-size:12px !important;
  }

  .modal-bg{
    align-items:flex-start;

    overflow-y:auto;

    padding:10px 0 140px;
  }

  .modal-box{
    width:80% !important;
    max-width:80% !important;

    max-height:none;

    overflow-y:visible;

    -webkit-overflow-scrolling:auto;
  }

  /* タイトル全体を2行構成にする */
  .history-title{
    line-height:1.2;
  }

  /* 「管理者修正履歴」だけ110% */
  .history-title strong{
    font-size:110%;
    display:block;   /* 1行目固定 */
  }

  /* 「（タップで開閉）」を2行目へ */
  .history-toggle-hint{
    display:block;
    margin-left:0;
    margin-top:3px;   /* ← 行間を広げる */
  }

  /* 凡例 */
  .legend-panel{
    left:6px;
    right:auto;
    top:auto;
    bottom:70px;
    width:130px;
    font-size:11px;
    padding:7px;
  }


  body,
  input,
  select,
  textarea,
  button,
  .leaflet-container,
  .leaflet-popup-content{
    font-family: Arial, "Helvetica Neue", sans-serif;
  }




  .reset-panel button{
    font-size:12px !important;
    padding:5px 8px;
  }


  /* スマホのみ：＋－ボタンを70%に縮小 */
  .leaflet-control-zoom{
    transform:scale(0.8);
    transform-origin:bottom left;
  }

 


}


/* パソコンのみの設定 */
@media (hover:hover) and (pointer:fine){


  .contact-panel{
    padding:4px 8px;
  }

  .reset-panel{
    padding:4px 8px;
  }

  .history-toggle-hint{
    display:none;
  }

  /* 「エリアを作図」ボタンの高さ調整 */
  .leaflet-top.leaflet-left .leaflet-draw{
    margin-top:90px;  
    margin-left:20px;
  }

  .admin-history-panel{
    height:310px;   /* 約140% */
  }

  #adminHistoryContent{
    height:260px;
  }

  .id-search-panel{
    top:450px;
    padding-top:2px;
    padding-bottom:2px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
  }

  /* 検索結果があるときだけ左へ拡張 */
  .id-search-panel.has-result{
    width:260px;              /* 左へ伸ばす */
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
  }

  /* 検索結果を左端に表示 */
  .id-search-panel.has-result .id-search-count{
    order:-1;
    width:auto;
    margin-right:auto;
    text-align:left;
  }

  .leaflet-draw-draw-polygon{
    width:auto !important;
    height:auto !important;
    background:none !important;
    border:none !important;
  }

  .leaflet-draw-draw-polygon::after{

    content:"✎　エリアを作図";

    font-size:18px;   /* 26px → 約50% */
    font-weight:bold;
    color:white;

    background:linear-gradient(#ff9f1a, #f58200);

    padding:13px 10px;   /* 18×42 → 約50% */

    border-radius:6px;

    border:2px solid white;

    box-shadow:0 2px 4px rgba(0,0,0,.25);

    text-shadow:0 1px 1px rgba(0,0,0,.25);

  }

  .leaflet-draw-actions{
    left:100% !important;

    margin-left:20px;

    white-space:nowrap;
  }

  .leaflet-bottom.leaflet-left{
    left:10px;     /* 右へ移動（数値を増やすほど右） */
  }


}
/* パソコンのみの設定 */




/* =========================
   作図エリア詳細専用ポップアップ
========================= */
.area-detail-popup{
  position:fixed;

  width:min(276px, 72vw);
  max-height:75vh;
  overflow-y:auto;

  box-sizing:border-box;
  padding:18px 16px;

  background:white;
  border-radius:12px;
  box-shadow:0 5px 22px rgba(0,0,0,.45);

  z-index:2500;

  font-size:13px;
  line-height:1.5;
}

.area-detail-popup::after{
  content:"";
  position:absolute;

  left:50%;
  bottom:-10px;

  transform:translateX(-50%);

  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:10px solid white;
}


.area-detail-drag-handle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;

  margin:-18px -16px 10px;
  padding:7px 7px 7px 10px;

  background:#fff4df;
  border-bottom:2px solid #ff9800;
  border-radius:12px 12px 0 0;

  font-weight:bold;

  cursor:grab;
  user-select:none;
  touch-action:none;
}

.area-detail-drag-handle:active,
.area-detail-drag-handle.dragging{
  cursor:grabbing;
  background:#ffe7bd;
}

.area-detail-drag-label{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.area-detail-title{
  white-space:nowrap;
}

.area-detail-move-hint{
  display:inline-flex;
  align-items:center;
  gap:3px;

  padding:3px 7px;

  background:#ff9800;
  color:white;
  border-radius:999px;

  font-size:10px;
  line-height:1.2;
  white-space:nowrap;

  box-shadow:0 1px 3px rgba(0,0,0,.2);

  animation:dragHintMove 1.2s ease 2;
}

.area-detail-grip{

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ2yW7xLP6HMoljPtirqel_LsS5By4th4T-VjT1HJ5bv5IIM05CnvkhSyiEDl6Iv0Y/exec";

const params = new URLSearchParams(location.search);

const CURRENT_CITY = params.get("city") || "";

const IS_PARENT_PAGE = !CURRENT_CITY;

const INDEX_SELECTED_AREA_KEY =
  "selectedAreaFromIndex";

const INDEX_SELECTED_AREA_MAX_AGE =
  5 * 60 * 1000;

const PAGE_TITLE =
  "【" + (CURRENT_CITY || "愛知県") + "】" +
  "大村知事悪政周知チラシ　配布エリア共有マップ";

document.title = PAGE_TITLE;

// データ通信の完了を待たず、市町村名をすぐ表示する
document.getElementById("titleBox").textContent = PAGE_TITLE;

document.getElementById("resetViewButton").textContent =
(CURRENT_CITY || "愛知県") + "を全体表示";

const isTouchDevice = window.matchMedia("(max-width:600px) and (pointer:coarse)").matches;
const INITIAL_MAP_CENTER = [35.18, 136.91];
const INITIAL_MAP_ZOOM = 8;
const map = L.map("map", { zoomControl:false }).setView(INITIAL_MAP_CENTER, INITIAL_MAP_ZOOM);


// 市境界の半透明塗りつぶし用：低い階層
map.createPane("cityBoundaryPane");
map.getPane("cityBoundaryPane").style.zIndex = 350;

// 作図済みエリア・作図中エリア用：高い階層
map.createPane("drawAreaPane");
map.getPane("drawAreaPane").style.zIndex = 550;

const cityBoundaryRenderer = L.svg({
  pane:"cityBoundaryPane"
});

const drawAreaRenderer = L.svg({
  pane:"drawAreaPane"
});


L.control.zoom({ position:"bottomleft" }).addTo(map);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"©OpenStreetMap"
}).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const plannedItemsById = {};
const areaItemsById = {};
const areaLayersById = {};
let pendingAreaChoiceHandler = null;
let pendingAreaChoiceIds = [];
let areaChoicePreviewActive = false;

let selectedAreaLayer = null;

let cityBoundaryReady = false;
let areaDataReady = false;

let allCityFeatures = [];
let currentDrawDisplayCities = [];

let currentRequestId = null;
let confirmCallback = null;
let confirmCancelCallback = null;
let areaFormResolver = null;
let doneFormResolver = null;
let transferCityResolver = null;
let mobileDrawing = false;
let mobilePoints = [];
let mobilePreviewLayer = null;
let ignoreNextClick = false;


// =========================
// Leaflet Draw 日本語化
// =========================
L.drawLocal.draw.toolbar.buttons.polygon = "エリアを作図";
L.drawLocal.draw.handlers.polygon.tooltip.start = "地図をクリックして配布エリアの1点目を決めてください";
L.drawLocal.draw.handlers.polygon.tooltip.cont = "続けてクリックして範囲を囲んでください。最初の点をクリックすると範囲が確定します";
L.drawLocal.draw.handlers.polygon.tooltip.end = "最初の点をクリックすると範囲が確定します";
L.drawLocal.draw.handlers.polygon.finish = {
  title:"この範囲で登録します",
  text:"この範囲で登録"
};
L.drawLocal.draw.toolbar.undo = {
  title:"直前の点を削除",
  text:"1つ戻る"
};
L.drawLocal.draw.toolbar.cancel = {
  title:"描画を中止します",
  text:"キャンセル"
};

const drawControl = new L.Control.Draw({
  position:"topleft",
  draw:{
    polygon:{
      shapeOptions:{
        pane:"drawAreaPane",
        renderer:drawAreaRenderer,
        color:"#ff6600",
        weight:5,
        fillColor:"#ff9800",
        fillOpacity:0.15
      }
    },

    rectangle:false,
    circle:false,
    marker:false,
    polyline:false,
    circlemarker:false
  },
  edit:{
    featureGroup:drawnItems,
    edit:false,
    remove:false
  }
});

if(!IS_PARENT_PAGE){
  map.addControl(drawControl);
}

if(isTouchDevice && !IS_PARENT_PAGE){
  document.getElementById("mobileDrawStart").style.display = "block";
  document.getElementById("mobileDrawPanel").style.display = "none";
  document.getElementById("mapCenterCross").style.display = "none";
}else{
  document.getElementById("mobileDrawStart").style.display = "none";
  document.getElementById("mobileDrawPanel").style.display = "none";
  document.getElementById("mapCenterCross").style.display = "none";

if(IS_PARENT_PAGE){
  document.getElementById("parentLinkPanel").style.display = "none";
}
}

// =========================
// 初期読み込み
// =========================
fetch("aichi.geojson")
  .then(res => res.json())
  .then(data => {

    // ポイントの所属市町村判定に使うため、
    // 愛知県全域の境界データを保持する
    allCityFeatures = data.features.filter(f =>
      f.properties.N03_004 &&
      f.properties.N03_004 !== "所属未定地"
    );

    const filteredFeatures = IS_PARENT_PAGE
      ? allCityFeatures
      : allCityFeatures.filter(f =>
          f.properties.N03_004 === CURRENT_CITY
        );

    console.log("CURRENT_CITY:", CURRENT_CITY);
    console.log("IS_PARENT_PAGE:", IS_PARENT_PAGE);
    console.log("filteredFeatures:", filteredFeatures.length);

    const filteredGeoJson = {
      type:"FeatureCollection",
      features:filteredFeatures
    };


    const boundary = L.geoJSON(filteredGeoJson, {

      pane:"cityBoundaryPane",
      renderer:cityBoundaryRenderer,

      style:{
        color:"#000",
        weight:2,
        fill:true,
        fillColor:"#dddddd",
        fillOpacity:0.5
      },

      onEachFeature:function(feature, layer){

        if(IS_PARENT_PAGE){

          layer.on("click", function(){

            const cityName = feature.properties.N03_004;

            if(!cityName) return;

            location.href =
              "map.html?city=" +
              encodeURIComponent(cityName);

          });

        }

      }

    }).addTo(map);

    restoreTransferredDraw();

    window.fullBounds = boundary.getBounds();

    fitFullBounds();

    cityBoundaryReady = true;
    restoreSelectedAreaFromIndex();

  });

fetch(
  SCRIPT_URL +
  "?city=" +
  encodeURIComponent(CURRENT_CITY)
)
  .then(res => res.json())
  .then(json => {
    renderAdminHistory(json.areas);

    const planned = [];
    const done = [];

    json.areas.forEach(row => {
      if(!row) return;
      if(!row["ID"]) return;
      if(!row["種類"]) return;
      if(!row["図形データ"]) return;

      let geo;

      try {
        geo = JSON.parse(row["図形データ"]);
      } catch(e) {
        console.warn("図形データの読み込みをスキップしました", row["ID"], e);
        return;
      }

      if(row["種類"] === "配布予定") planned.push({ geo, row });
      if(row["種類"] === "配布済") done.push({ geo, row });
    });

    planned.forEach(drawLayer);
    done.forEach(drawLayer);

    areaDataReady = true;
    restoreSelectedAreaFromIndex();
  });

// =========================
// 地図・描画
// =========================
function drawLayer(item){
  const layer = L.geoJSON(item.geo, {
    pane:"drawAreaPane",
    renderer:drawAreaRenderer,
    style:{
      color:getColor(item.row["種類"]),
      fillColor:getColor(item.row["種類"]),
      fillOpacity:item.row["種類"] === "配布済" ? 0.5 : 0.35
    }
  }).addTo(drawnItems);


  const id = item.row["ID"];
  const isPlanned = item.row["種類"] === "配布予定";

  areaItemsById[id] = item;
  areaLayersById[id] = layer;

  if(isPlanned){
    plannedItemsById[id] = item;
  }

  
  if(!IS_PARENT_PAGE){

  layer.on("click", function(e){

    L.DomEvent.stopPropagation(e);

    handleOverlappingAreaClick(
      id,
      e.latlng,
      selectAreaById
    );

  });

}

}

map.on("draw:created", async function(e){
  const layer = e.layer;

    if(!(await validateDrawAreaCity(layer))){
      return;
    }

  const geo = layer.toGeoJSON();
  const formData = await openAreaForm();

  if(!formData) return;

  saveNewArea(geo, layer, formData);
});

// 点が境界線上にあるか判定
function isPointOnSegment(point, start, end){

  const [px, py] = point;
  const [ax, ay] = start;
  const [bx, by] = end;

  const dx = bx - ax;
  const dy = by - ay;

  const lengthSquared =
    dx * dx +
    dy * dy;

  const epsilon = 0.0000000001;

  // GeoJSONの最初と最後が同じ座標の場合
  // その座標自体と一致するときだけ境界線上と判定
  if(lengthSquared < epsilon * epsilon){

    return (
      Math.abs(px - ax) < epsilon &&
      Math.abs(py - ay) < epsilon
    );
  }

  const cross =
    (px - ax) * dy -
    (py - ay) * dx;

  if(Math.abs(cross) > epsilon){
    return false;
  }

  const dot =
    (px - ax) * dx +
    (py - ay) * dy;

  return (
    dot >= -epsilon &&
    dot <= lengthSquared + epsilon
  );
}

// 点がリング内にあるか判定
function isPointInRing(point, ring){

  let inside = false;

  for(
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ){

    const current = ring[i];
    const previous = ring[j];

    // 境界線上のポイントも市内として扱う
    if(isPointOnSegment(point, previous, current)){
      return true;
    }

    const intersects =
      (
        (current[1] > point[1]) !==
        (previous[1] > point[1])
      ) &&
      (
        point[0] <
        (
          (previous[0] - current[0]) *
          (point[1] - current[1])
        ) /
        (previous[1] - current[1]) +
        current[0]
      );

    if(intersects){
      inside = !inside;
    }
  }

  return inside;
}


// 点がPolygon内にあるか判定
function isPointInPolygonCoordinates(point, coordinates){

  if(!coordinates || !coordinates.length){
    return false;
  }

  // 外周の外なら対象外
  if(!isPointInRing(point, coordinates[0])){
    return false;
  }

  // 穴の中なら対象外
  for(let i = 1; i < coordinates.length; i++){

    if(isPointInRing(point, coordinates[i])){
      return false;
    }
  }

  return true;
}


// 点が市町村の図形内にあるか判定
function isPointInCityFeature(point, feature){

  if(
    !feature ||
    !feature.geometry
  ){
    return false;
  }

  const geometry = feature.geometry;

  if(geometry.type === "Polygon"){

    return isPointInPolygonCoordinates(
      point,
      geometry.coordinates
    );
  }

  if(geometry.type === "MultiPolygon"){

    return geometry.coordinates.some(polygon =>
      isPointInPolygonCoordinates(
        point,
        polygon
      )
    );
  }

  return false;
}


// Leafletのポイント配列を平らにする
function flattenDrawLatLngs(latlngs, result = []){

  if(!Array.isArray(latlngs)){
    return result;
  }

  latlngs.forEach(item => {

    if(Array.isArray(item)){

      flattenDrawLatLngs(item, result);

    }else if(
      item &&
      typeof item.lat === "number" &&
      typeof item.lng === "number"
    ){

      result.push(item);
    }
  });

  return result;
}


// 作図ポイントが存在する市町村名を取得
function getCitiesFromDrawPoints(latlngs){

  const points = flattenDrawLatLngs(latlngs);
  const cityNames = new Set();

  points.forEach(latlng => {

    // GeoJSONは「経度・緯度」の順
    const point = [
      latlng.lng,
      latlng.lat
    ];

    allCityFeatures.forEach(feature => {

      if(!isPointInCityFeature(point, feature)){
        return;
      }

      const cityName =
        feature.properties &&
        feature.properties.N03_004;

      if(cityName){
        cityNames.add(cityName);
      }
    });
  });

  return Array.from(cityNames);
}

// 囲み終わり時の市町村チェック
async function validateDrawAreaCity(layer){

  currentDrawDisplayCities = [];

  if(!allCityFeatures.length){

    alert(
      "市町村境界データを読み込み中です。\n" +
      "少し待ってから、もう一度作図してください。"
    );

    removeTemporaryDrawLayer(layer);
    return false;
  }

  const cityNames =
    getCitiesFromDrawPoints(layer.getLatLngs());

    currentDrawDisplayCities =
      Array.from(new Set(cityNames));

  // 現在の市にポイントがあれば通常どおり登録
  if(cityNames.includes(CURRENT_CITY)){
    return true;
  }

  removeTemporaryDrawLayer(layer);

  // どの市町村にもポイントがない場合
  if(cityNames.length === 0){

    alert(
      "作図ポイントが市町村内に1つもありません。\n\n" +
      "海上や愛知県外に作図されていないか確認してください。"
    );

    return false;
  }

  // 別の市町村にポイントがある場合
  const destinationCity =
    await selectTransferCity(cityNames);

  if(!destinationCity){
    return false;
  }

  transferDrawToCity(
    layer,
    destinationCity
  );

  return false;
}

function startMobileDraw(){
  if(!isTouchDevice) return;

  mobileDrawing = true;
  mobilePoints = [];

  if(mobilePreviewLayer){
    map.removeLayer(mobilePreviewLayer);
    mobilePreviewLayer = null;
  }

  document.getElementById("mobileDrawStart").style.display = "none";
  document.getElementById("mobileDrawPanel").style.display = "flex";
  document.getElementById("mapCenterCross").style.display = "block";

  alert("地図の中心に合わせて「ここに点を追加」を押してください。3点以上で囲めます。");
}

function addMobilePoint(){
  if(!isTouchDevice) return;

  if(!mobileDrawing){
    alert("先に「エリアを作図」を押してください");
    return;
  }

  const center = map.getCenter();
  mobilePoints.push([center.lat, center.lng]);
  updateMobilePreview();
}

function undoMobilePoint(){
  if(!isTouchDevice || mobilePoints.length === 0) return;

  mobilePoints.pop();
  updateMobilePreview();
}

function updateMobilePreview(){
  if(mobilePreviewLayer){
    map.removeLayer(mobilePreviewLayer);
    mobilePreviewLayer = null;
  }

  if(mobilePoints.length === 1){
    mobilePreviewLayer = L.circleMarker(mobilePoints[0], {
      pane:"drawAreaPane",
      renderer:drawAreaRenderer,
      radius:5,
      color:"#ff6600",
      fillColor:"#ff6600",
      fillOpacity:0.8
    }).addTo(map);
    return;
  }

  if(mobilePoints.length >= 2){
    mobilePreviewLayer = L.polyline(mobilePoints, {
      pane:"drawAreaPane",
      renderer:drawAreaRenderer,
      color:"#ff6600",
      weight:5
    }).addTo(map);
  }
}

async function finishMobileDraw(){
  if(!isTouchDevice) return;

  if(!mobileDrawing){
    alert("先に「エリアを作図」を押してください");
    return;
  }

  if(mobilePoints.length < 3){
    alert("範囲を作るには3点以上必要です");
    return;
  }

  const geo = {
    type:"Feature",
    properties:{},
    geometry:{
      type:"Polygon",
      coordinates:[mobilePoints.map(p => [p[1], p[0]])]
    }
  };

  const layer = L.geoJSON(geo, {
    pane:"drawAreaPane",
    renderer:drawAreaRenderer
  }).getLayers()[0];

  if(!(await validateDrawAreaCity(layer))){

    mobilePoints = [];

    if(mobilePreviewLayer){
      map.removeLayer(mobilePreviewLayer);
      mobilePreviewLayer = null;
    }

    return;
  }

  const formData = await openAreaForm();

  if(!formData) return;

  clearMobileDrawUi();
  saveNewArea(geo, layer, formData);
}

function restoreTransferredDraw(){

  const savedData =
    sessionStorage.getItem(TRANSFER_DRAW_KEY);

  if(!savedData){
    return;
  }

  // 繰り返し復元されないよう、先に削除
  sessionStorage.removeItem(TRANSFER_DRAW_KEY);

  let transferData;

  try{

    transferData = JSON.parse(savedData);

  }catch(error){

    console.error(
      "作図データの復元に失敗しました",
      error
    );

    return;
  }

  if(
    !transferData ||
    !transferData.geo ||
    transferData.destinationCity !== CURRENT_CITY
  ){
    return;
  }

  // 30分以上経過した一時データは復元しない
  if(
    transferData.savedAt &&
    Date.now() - transferData.savedAt > 30 * 60 * 1000
  ){
    return;
  }

  const restoredLayer = L.geoJSON(
    transferData.geo,
    {
      pane:"drawAreaPane",
      renderer:drawAreaRenderer,
      style:{
        color:"#ff6600",
        weight:5,
        fillColor:"#ff9800",
        fillOpacity:0.15
      }
    }
  ).getLayers()[0];

  if(!restoredLayer){
    return;
  }

  map.fitBounds(
    restoredLayer.getBounds(),
    {
      padding:[40, 40],
      animate:false
    }
  );

  // 通常の作図完了と同じ処理へ渡す
  setTimeout(() => {

    map.fire(
      L.Draw.Event.CREATED,
      {
        layer:restoredLayer,
        layerType:"polygon"
      }
    );

  }, 100);
}

// =========================
// ポップアップ・表示
// =========================
function getColor(type){
  if(type === "配布済") return "#ff3333";
  if(type === "配布予定") return "#0066ff";
  return "#999";
}

function formatDateSimple(value){
  if(!value) return "";

  const d = new Date(value);
  if(isNaN(d)) return value;

  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
}
function isLeafletLatLng(value){
  return (
    value &&
    typeof value.lat === "number" &&
    typeof value.lng === "number"
  );
}

function isLatLngInRing(point, ring){

  let inside = false;

  for(
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ){

    const current = ring[i];
    const previous = ring[j];

    const crossesLatitude =
      (current.lat > point.lat) !==
      (previous.lat > point.lat);

    const intersectionLng =
      (
        (previous.lng - current.lng) *
        (point.lat - current.lat)
      ) /
      (previous.lat - current.lat) +
      current.lng;

    if(
      crossesLatitude &&
      point.lng < intersectionLng
    ){
      inside = !inside;
    }
  }

  return inside;
}

function isLatLngInPolygonShape(point, latlngs){

  if(!Array.isArray(latlngs) || !latlngs.length){
    return false;
  }

  if(isLeafletLatLng(latlngs[0])){
    return isLatLngInRing(point, latlngs);
  }

  if(
    Array.isArray(latlngs[0]) &&
    isLeafletLatLng(latlngs[0][0])
  ){

    if(!isLatLngInRing(point, latlngs[0])){
      return false;
    }

    return !latlngs
      .slice(1)
      .some(hole => isLatLngInRing(point, hole));
  }

  return latlngs.some(
    polygon =>
      isLatLngInPolygonShape(point, polygon)
  );
}

function isLatLngInsideAreaLayer(point, areaLayer){

  let isInside = false;

  function inspectLayer(layer){

    if(isInside) return;

    if(
      layer instanceof L.Polygon &&
      typeof layer.getLatLngs === "function"
    ){
      isInside = isLatLngInPolygonShape(
        point,
        layer.getLatLngs()
      );
      return;
    }

    if(typeof layer.eachLayer === "function"){
      layer.eachLayer(inspectLayer);
    }
  }

  inspectLayer(areaLayer);
  return isInside;
}

function getAreaIdsAtLatLng(latlng){

  return Object.keys(areaLayersById)
    .filter(id => {

      const layer = areaLayersById[id];

      return (
        layer &&
        isLatLngInsideAreaLayer(latlng, layer)
      );
    });
}

  document.getElementById(
    "areaChoiceOverlay"
  ).style.display = "none";

  if(clearPreview){
    clearAreaChoicePreview();
  }

  pendingAreaChoiceHandler = null;
  pendingAreaChoiceIds = [];
}

function showAreaChoiceOverlay(areaIds, onSelect){

  const overlay =
    document.getElementById("areaChoiceOverlay");

  const list =
    document.getElementById("areaChoiceList");

  list.innerHTML = "";
  pendingAreaChoiceHandler = onSelect;
  pendingAreaChoiceIds = areaIds.slice();

  areaIds
    .slice()
    .sort((idA, idB) => {

      const typeA =
        areaItemsById[idA]?.row?.["種類"] || "";

      const typeB =
        areaItemsById[idB]?.row?.["種類"] || "";

      if(typeA === typeB) return 0;
      if(typeA === "配布予定") return -1;
      if(typeB === "配布予定") return 1;
      return typeA.localeCompare(typeB, "ja");
    })
    .forEach(id => {

      const item = areaItemsById[id];
      if(!item) return;

      const row = item.row;
      const type = row["種類"] || "種類未入力";

      const button =
        document.createElement("button");

      button.type = "button";
      button.className =
        "area-choice-button " +
        (
          type === "配布予定"
            ? "planned"
            : type === "配布済"
              ? "done"
              : ""
        );

      const typeText =
        document.createElement("span");

      typeText.className = "area-choice-type";
      typeText.textContent = type;

      const metaText =
        document.createElement("span");

      metaText.className = "area-choice-meta";

      const dateText =
        formatDateSimple(row["実施日"]) ||
        "未入力";

      const countText =
        row["枚数"] !== "" &&
        row["枚数"] !== null &&
        row["枚数"] !== undefined
          ? row["枚数"] + "枚"
          : "未入力";

      const shortId =
        String(id).length > 16
          ? String(id).slice(0, 16) + "…"
          : String(id);

      metaText.textContent =
        "日付：" + dateText +
        "　枚数：" + countText +
        "　ID：" + shortId;

      button.appendChild(typeText);
      button.appendChild(metaText);

      button.addEventListener("click", function(){

        const handler =
          pendingAreaChoiceHandler;

        const choiceIds =
          pendingAreaChoiceIds.slice();

        closeAreaChoiceOverlay(false);

        if(handler){
          confirmAreaChoiceSelection(
            id,
            choiceIds,
            handler
          );
        }
      });

      list.appendChild(button);
    });

  overlay.style.display = "flex";
}

function previewAreaChoiceById(id){

  const layer = areaLayersById[id];
  const item = areaItemsById[id];

  if(!layer || !item) return false;

  if(IS_PARENT_PAGE){

    closeAreaDetailPopup(false);
    clearCityHighlight();
    clearAreaHighlight();

    layer.setStyle({
      color:"#ffd600",
      weight:6
    });

    layer.bringToFront();
    highlightedAreaLayer = layer;
    highlightedAreaId = id;

  }else{

    closeAreaDetailPopup();
    highlightSelectedArea(
      layer,
      item.row["種類"]
    );
  }

  areaChoicePreviewActive = true;

  map.fitBounds(layer.getBounds(), {
    padding:IS_PARENT_PAGE ? [60, 60] : [40, 40],
    animate:false
  });

  return true;
}

function confirmAreaChoiceSelection(
  id,
  areaIds,
  onSelect
){

  if(!previewAreaChoiceById(id)) return;

  openConfirm(
    "このエリアの詳細を確認しますか？",
    function(){
      areaChoicePreviewActive = false;
      onSelect(id);
    },
    function(){
      showAreaChoiceOverlay(areaIds, onSelect);
    },
    "戻る"
  );
}

function handleOverlappingAreaClick(
  clickedId,
  latlng,
  selectArea
){

  const areaIds =
    getAreaIdsAtLatLng(latlng);

  if(!areaIds.includes(clickedId)){
    areaIds.unshift(clickedId);
  }

  if(areaIds.length <= 1){
    selectArea(areaIds[0]);
    return;
  }

  showAreaChoiceOverlay(
    areaIds,
    selectArea
  );
}



function highlightSelectedArea(layer, type){

  // 前に選択していたエリアを元に戻す
  if(selectedAreaLayer){

    const originalType =
      selectedAreaLayer._areaType;

    selectedAreaLayer.setStyle({
      color:getColor(originalType),
      fillColor:getColor(originalType),
      weight:3,
      fillOpacity:
        originalType === "配布済"
          ? 0.5
          : 0.35
    });

  }

  selectedAreaLayer = layer;
  selectedAreaLayer._areaType = type;

  // 今選択したエリアだけ強調
  selectedAreaLayer.setStyle({
    color:"#ffeb3b",
    weight:5,
    fillOpacity:
      type === "配布済"
        ? 0.65
        : 0.5
  });

  selectedAreaLayer.bringToFront();
}

// エリア詳細ボックスの出現位置
function showAreaDetailPopup(row, isPlanned, latlng){

    document.getElementById("areaDetailPopup");

    "manually-moved",

  );

  const content =
    document.getElementById("areaDetailPopupContent");

  content.innerHTML =
    makePopupHtml(row, isPlanned);

  popup.style.display = "block";

  const popupWidth =
    popup.offsetWidth;

  const popupHeight =
    popup.offsetHeight;

  const sideMargin = 8;

  const isMobile = window.matchMedia(
    "(max-width:600px) and (pointer:coarse)"
  ).matches;

  let left;
  let top;

  if(isMobile){

    // スマホ：画面右上（上部タイトルの下）
    left =
      window.innerWidth -
      popupWidth -
      sideMargin;

    top = 55;

  }else{

    // パソコン：左から25％、上下中央より少し上
    left =
      window.innerWidth * 0.2 -
      popupWidth / 2;

    top =
      window.innerHeight * 0.47 -
      popupHeight / 2;
  }

  left = Math.max(
    sideMargin,
    Math.min(
      left,
      window.innerWidth -
      popupWidth -
      sideMargin
    )
  );

  top = Math.max(
    sideMargin,
    Math.min(
      top,
      window.innerHeight -
      popupHeight -
      sideMargin
    )
  );

  popup.style.left = left + "px";
  popup.style.top = top + "px";
}

  let savedData;

  try{

      INDEX_SELECTED_AREA_KEY
    );
  }catch(error){
    console.warn("選択エリアを取得できませんでした", error);
    return;
  }

  if(!savedData){
    return;
  }

  // 再読み込み時に繰り返し復元されないよう、先に削除
  sessionStorage.removeItem(
    INDEX_SELECTED_AREA_KEY
  );

  let savedSelection;

  try{
    savedSelection = JSON.parse(savedData);
  }catch(error){
    console.warn("選択エリア情報を読み取れませんでした", error);
    return;
  }

  if(!savedSelection || !savedSelection.id){
    return;
  }

  // 古い一時情報や、別の市ページ用の情報は使用しない
  if(
    !savedSelection.savedAt ||
    Date.now() - savedSelection.savedAt >
      INDEX_SELECTED_AREA_MAX_AGE ||
    (
      savedSelection.city &&
      savedSelection.city !== CURRENT_CITY
    )
  ){
    return;
  }

  selectAreaById(
    String(savedSelection.id)
  );
}

let areaPopupDragging = false;
let areaPopupOffsetX = 0;
let areaPopupOffsetY = 0;

const areaDetailPopup =
  document.getElementById("areaDetailPopup");

const areaDetailDragHandle =
  document.getElementById("areaDetailDragHandle");


areaDetailDragHandle.addEventListener(
  "pointerdown",
  function(e){

    // 閉じるボタンを押したときはドラッグしない
    if(e.target.closest(".area-detail-close")){
      return;
    }

    areaPopupDragging = true;
    areaDetailDragHandle.classList.add("dragging");

    const rect =
      areaDetailPopup.getBoundingClientRect();

    areaPopupOffsetX =
      e.clientX - rect.left;

    areaPopupOffsetY =
      e.clientY - rect.top;

    areaDetailDragHandle.setPointerCapture(
      e.pointerId
    );

    e.preventDefault();
  }
);


areaDetailDragHandle.addEventListener(
  "pointermove",
  function(e){

    if(!areaPopupDragging){
      return;
    }

    const popupWidth =
      areaDetailPopup.offsetWidth;

    const popupHeight =
      areaDetailPopup.offsetHeight;

    let left =
      e.clientX - areaPopupOffsetX;

    let top =
      e.clientY - areaPopupOffsetY;

    const margin = 8;

    left = Math.max(
      margin,
      Math.min(
        left,
        window.innerWidth -
        popupWidth -
        margin
      )
    );

    top = Math.max(
      margin,
      Math.min(
        top,
        window.innerHeight -
        popupHeight -
        margin
      )
    );

    areaDetailPopup.style.left =
      left + "px";

    areaDetailPopup.style.top =
      top + "px";

    // 手動移動後は三角形を消す
    areaDetailPopup.classList.add(
      "manually-moved"
    );
  }
);


function stopAreaPopupDrag(e){

  if(!areaPopupDragging){
    return;
  }

  areaPopupDragging = false;
  areaDetailDragHandle.classList.remove("dragging");

  try{
    areaDetailDragHandle.releasePointerCapture(
      e.pointerId
    );
  }catch(error){
    // PointerCaptureが解除済みの場合は何もしない
  }

}


areaDetailDragHandle.addEventListener(
  "pointerup",
  stopAreaPopupDrag
);


areaDetailDragHandle.addEventListener(
  "pointercancel",
  stopAreaPopupDrag
);

function getDisplayCitiesFromRow(row){

  const cityNames =
    String(row["表示市町村"] || "")
      .split("|")
      .map(name => name.trim())
      .filter(Boolean);

  const primaryCity =
    String(row["市町村"] || "").trim();

  if(primaryCity){
    cityNames.push(primaryCity);
  }

  const uniqueCities =
    Array.from(new Set(cityNames));

  if(uniqueCities.length){
    return uniqueCities;
  }

  return CURRENT_CITY
    ? [CURRENT_CITY]
    : [];
}

async function convertPlannedToDone(id){
  const item = plannedItemsById[id];

  if(!item){
    alert("配布予定データが見つかりません");
    return;
  }

  const formData = await openDoneForm(item.row);
  if(!formData) return;

  fetch(SCRIPT_URL, {
    method:"POST",
    body:JSON.stringify({
      pass:formData.pass,
      id:id + "（2）",
      baseId:id,

      city:
        item.row["市町村"] ||
        CURRENT_CITY,

      displayCities:
        getDisplayCitiesFromRow(item.row),

      type:"配布済",
      date:formData.date,
      count:formData.count,
      person:formData.person,
      note:formData.note,
      geometry:item.geo
    })
  })
  .then(res => res.json())
  .then(result => {
    if(result.status !== "OK"){
      alert("合言葉が違います");
      return;
    }

    const doneLayer = L.geoJSON(item.geo, {
      pane:"drawAreaPane",

      style:{
        color:getColor("配布済"),
        fillColor:getColor("配布済"),
        fillOpacity:0.5
      }
    }).addTo(drawnItems);

// 元の配布予定エリアより前面に出す
doneLayer.bringToFront();

    const doneDisplayCities =
      getDisplayCitiesFromRow(item.row);

    const doneRow = {
      "ID":id + "（2）",
      "種類":"配布済",
      "実施日":formData.date,
      "枚数":formData.count,
      "担当者":formData.person,
      "備考":formData.note,
      "市町村":
        item.row["市町村"] ||
        CURRENT_CITY,
      "表示市町村":
        doneDisplayCities.join("|")
    };

    const doneItem = { geo:item.geo, row:doneRow };
    areaItemsById[doneRow["ID"]] = doneItem;
    areaLayersById[doneRow["ID"]] = doneLayer;

    
    doneLayer.on("click", function(e){

      L.DomEvent.stopPropagation(e);

      handleOverlappingAreaClick(
        doneRow["ID"],
        e.latlng,
        selectAreaById
      );

});


const doneBounds = doneLayer.getBounds();

const donePopupLatLng = L.latLng(
  doneBounds.getNorth(),
  (
    doneBounds.getEast() +
    doneBounds.getWest()
  ) / 2
);

highlightSelectedArea(
  doneLayer,
  "配布済"
);

showAreaDetailPopup(
  doneRow,
  false,
  donePopupLatLng
);

  });
}

function splitDateValue(value){
  if(!value) return { year:"", month:"", day:"" };

  const d = new Date(value);

  if(!isNaN(d)){
    return {
      year:String(d.getFullYear()),
      month:String(d.getMonth() + 1),
      day:String(d.getDate())
    };
  }

  const parts = String(value).split("/");
  return {
    year:parts[0] || "",
    month:parts[1] || "",
    day:parts[2] || ""
  };
}

function fitFullBounds(){

  const bounds = window.fullBounds;

  // 市境界データの読み込み前や読み込み失敗時でも、
  // 「全体表示に戻る」が無反応にならないよう初期位置へ戻す
  if(
    !bounds ||
    typeof bounds.isValid !== "function" ||
    !bounds.isValid()
  ){
    map.setView(INITIAL_MAP_CENTER, INITIAL_MAP_ZOOM, {
      animate:false
    });
    return;
  }

  const isMobile =
    window.matchMedia(
      "(max-width:600px) and (pointer:coarse)"
    ).matches;

  if(isMobile){

    map.fitBounds(bounds, {

      // 上側の余白を大きくして、市全体を下へ寄せる。全体表示の大きさ。
      paddingTopLeft:[100, 190],
      paddingBottomRight:[50, 50],

      animate:false
    });

  }else{

    map.fitBounds(bounds, {
      padding:[60, 60],
      animate:false
    });

  }

}

// =========================
// 検索・表示補助
// =========================
function resetView(){

  // 詳細表示側に問題があっても、地図を戻す処理は必ず続行する
  try{
    closeAreaDetailPopup();
  }catch(error){
    console.warn("詳細表示を閉じられませんでした", error);
  }

  map.closePopup();
  map.stop();
  fitFullBounds();

}

function openConfirm(
  message,
  callback,
  cancelCallback = null,
  cancelLabel = "キャンセル"
){

  confirmCallback = callback;
  confirmCancelCallback = cancelCallback;

  document.getElementById("confirmMessage").innerHTML =
    message;

  document.getElementById("confirmCancelButton").textContent =
    cancelLabel;

  document.getElementById("confirmOverlay").style.display =
    "flex";
}

function closeConfirm(){

  document.getElementById("confirmOverlay").style.display =
    "none";

  confirmCallback = null;
  confirmCancelCallback = null;

  document.getElementById("confirmCancelButton").textContent =
    "キャンセル";
}


function searchAreaById(){

  const keyword =
    document.getElementById("idSearchInput").value.trim();

  const countBox =
    document.getElementById("idSearchResultCount");

  if(!keyword){

    alert("IDを入力してください");
    countBox.textContent = "";
    return;
  }

  const matchedIds =
    Object.keys(areaLayersById)
      .filter(id => id.includes(keyword));

  countBox.textContent = matchedIds.length + "件";

  if(matchedIds.length === 0){

    alert("該当するIDのエリアが見つかりませんでした");
    return;
  }

  const matchedId = matchedIds[0];

  if(!selectAreaById(matchedId)){
    alert("エリア情報を正しく取得できませんでした");
  }
}


// =========================
// スマホ：二本指ズーム中の誤クリック防止
// =========================
map.getContainer().addEventListener("touchstart", function(e){
  if(e.touches.length >= 2){
    ignoreNextClick = true;
  }
}, { passive:true });

map.getContainer().addEventListener("touchend", function(){
  setTimeout(function(){
    ignoreNextClick = false;
  }, 300);
}, { passive:true });



// =========================
// onclick用に公開
// =========================
window.startMobileDraw = startMobileDraw;
window.addMobilePoint = addMobilePoint;
window.undoMobilePoint = undoMobilePoint;
window.finishMobileDraw = finishMobileDraw;
window.cancelMobileDraw = cancelMobileDraw;

window.submitAreaForm = submitAreaForm;
window.cancelAreaForm = cancelAreaForm;
window.submitDoneForm = submitDoneForm;
window.cancelDoneForm = cancelDoneForm;

window.openContactForm = openContactForm;
window.submitContactForm = submitContactForm;
window.cancelContactForm = cancelContactForm;

window.openRequestMenu = openRequestMenu;
window.chooseDeleteRequest = chooseDeleteRequest;
window.chooseModifyRequest = chooseModifyRequest;
window.cancelRequestChoice = cancelRequestChoice;
window.submitModifyRequest = submitModifyRequest;
window.cancelRequestForm = cancelRequestForm;

function goParentPage(){
  location.href = "index.html";
}

window.convertPlannedToDone = convertPlannedToDone;
window.copyAreaId = copyAreaId;
window.searchAreaById = searchAreaById;

document.getElementById("confirmOkButton")
.addEventListener("click", function(){

  const cb = confirmCallback;

  closeConfirm();

  if(cb) cb();

});

document.getElementById("confirmCancelButton")
.addEventListener("click", function(){

  const cb = confirmCancelCallback;

  closeConfirm();

  if(cb) cb();

});

document.getElementById("areaChoiceCancel")
.addEventListener("click", closeAreaChoiceOverlay);

document.getElementById("areaChoiceOverlay")
.addEventListener("click", function(e){
  if(e.target === this){
    closeAreaChoiceOverlay();
  }
});

window.resetView = resetView;
window.goParentPage = goParentPage;
window.toggleHistoryPanel = toggleHistoryPanel;


document
  .getElementById("areaDetailPopup")
  .addEventListener("click", function(e){
    e.stopPropagation();
  });

</script>
